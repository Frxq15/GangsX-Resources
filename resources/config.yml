#these are the arguments used in /gadmin setupgrade <gang> <upgrade> <value>
#EXAMPLE: /gadmin setupgrade examplegang member_limit 5 - sets the gang member limit to 5 for the gang "examplegang"
#NOTE: for coloured_description, the value must be 0 or 1, setting to 1 will allow access, 0 will deny access
upgrades:
  member_limit:
    0:
      value: 3
    1:
        cost: 50000000
        cost_currency: 'tokens'
        requirements:
          level: 3
        value: 5
    2:
        cost: 100000000
        cost_currency: 'tokens'
        requirements:
          level: 5
          blocksmined: 500000
        value: 6
  bank_limit:
    0:
      value: 150000000
    1:
        cost: 50000000
        cost_currency: 'tokens'
        requirements:
          kills: 150
        value: 15000000000
    2:
        cost: 5000000000
        cost_currency: 'tokens'
        requirements:
          kills: 350
          level: 10
        value: 250000000000
  coloured_description:
    0:
      value: 0
    1:
        cost: 50000000
        cost_currency: 'money'
        requirements:
          level: 5
        value: 1
  weekly_quests:
    0:
      value: 0
    1:
      cost: 500000000
      cost_currency: 'money'
      requirements:
        level: 8
      value: 1
  daily_quests:
    0:
      value: 0
    1:
      cost: 500000000
      cost_currency: 'money'
      requirements:
        level: 9
      value: 1
  max_allies:
    0:
      value: 1
    1:
        cost: 50000000
        cost_currency: 'tokens'
        requirements: []
        value: 2
    2:
        cost: 100000000
        cost_currency: 'tokens'
        requirements:
          level: 25
          blocksmined: 10000000
        value: 3
  cell_expansion:
    0:
      value: 0
    1:
      cost: 500
      cost_currency: 'points'
      requirements: []
      value: 65 #this will set the cell radius to 65
    2:
      cost: 1500
      cost_currency: 'points'
      requirements: []
      value: 100
    3:
      cost: 5000
      cost_currency: 'points'
      requirements: []
      value: 125
  vault:
    0:
      value: 0
    1:
        cost: 50000000
        cost_currency: 'tokens'
        requirements: []
        value: 1
    2:
        cost: 100000000
        cost_currency: 'tokens'
        requirements: []
        value: 2
    3:
        cost: 200000000
        cost_currency: 'tokens'
        requirements: []
        value: 3
    4:
        cost: 500000000
        cost_currency: 'tokens'
        requirements: []
        value: 4
    5:
        cost: 1000000000
        cost_currency: 'tokens'
        requirements: []
        value: 5
  home_limit:
    0:
      value: 1
    1:
        cost: 50000000
        cost_currency: 'tokens'
        requirements: []
        value: 2
    2:
        cost: 100000000
        cost_currency: 'tokens'
        requirements: []
        value: 3
    3:
        cost: 200000000
        cost_currency: 'tokens'
        requirements: []
        value: 4
    4:
        cost: 500000000
        cost_currency: 'tokens'
        requirements: []
        value: 5