default-radius: 50
cell-spacing: 650 #the spacing between cells, this is used to prevent players from seeing adjacent cells
warmup: 5 #teleportation warmup - use gangsx.cell.bypasstimer to bypass the warmup
redeem-sound:
  enabled: true
  sound: 'ENTITY_PLAYER_LEVELUP'
delete-respawn-world: 'world' #the world players will respawn in after their cell is deleted
keep-value-on-reset: true #whether or not to keep the cell value when a cell is reset


value_items:
  value25:
    value: 25
    item: 'IRON_BLOCK'
    glow: false
    name: '&e25x Cell Value'
    lore:
      - '&fRedeem this value item to add value to your'
      - '&fgang cell, value is added immediately upon redeeming.'
      - ''
      - '&b&l • &fValue: &bx25'
      - ''
