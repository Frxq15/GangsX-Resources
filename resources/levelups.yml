# The levelup system can be defined as either 'v1' or 'v2'
# v1 - Using this system will enable the /g levelup command where it is a manual process for the gang to levelup,
# you are able to define any gang statistic as a requirement if you are using this system.
# v2 - Using this system the /g levelup command will not be registered, instead the levelups will become automatic based on the blocksmined
# by the gang, you are able to define specific level rewards and increase the difficulty.
system: 'v1'
max-level: 100

sound: # Sound played when a gang levels up
  enabled: true
  effect: 'ENTITY_PLAYER_LEVELUP' # Set to NONE and it will disable the sound

# Levelup system v2 configuration

#NOTE: V2 is a new system that is not compatible with V1, if you are using V2 you will not be able to use the /g levelup command.
# The levelup system will automatically levelup the gang based on the blocksmined.
v2:
  starting-requirement: 1000 #gangs are level 1 by default, this is the starting requirement for level 2
  increase-requirement-by: 1000
  difficulty-requirements:
    enabled: true
    levels:
      10: 1500 #example: Level 9 requires 8,000 blocks, with this level 10 is 9,000 (previous level) + 1,000 (increase) + 1,500 (bonus) = 11,500
      20: 3500
      30: 5500
      40: 7500
      50: 9500
      75: 13500
      100: 16500
  rewards:
    for-each:
      message:
        enabled: true
        message:
          - ''
          - '&a&lGang Levelup &8- &e&lLevel %level%'
          - '&fCongrats on leveling up, you have unlocked:'
          - ''
          - '&e&l • &f5x Gang Coins'
          - ''
      commands:
        enabled: true
        commands:
          - 'gadmin addstat %gang% coins 5'
    for-specific:
      '10':
        message:
          enabled: true
          message:
           - ''
           - '&a&lGang Levelup &8- &d&lLevel 10'
           - '&fCongrats on leveling up, you have unlocked:'
           - ''
           - '&d&l • &f10x Gang Coins'
           - ''
        commands:
          enabled: true
          commands:
            - 'gadmin addstat %gang% coins 10'


# Levelup system v1 configuration

#NOTE: V1 is the old system that is not compatible with V2, if you are using V1 you will not be able to use the automatic levelup system.
# The levelup system will require the gang to manually levelup using the /g levelup command.
# You can define any statistic as a requirement for the levelup, you can also define a message to be sent to the player when they fail to levelup.

v1:
  2:
    requirements:
      #You can use any of the following statistics as requirements:
      # coins, bankbalance, kills, deaths, blocksmined, blocksplaced, kothwins, bosskills, mobkills, tokens_gained, points or custom statistics
      blocksmined: 1000
      kills: 5
