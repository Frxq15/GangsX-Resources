# Gang Schedules Menu Configuration
# This menu displays upcoming KoTH and Tournament events with live updating placeholders
# There is also full PlaceholderAPI support for custom placeholders
#
# Item Types:
#   KOTH: 'koth_id'         - Displays KoTH information for the specified koth ID
#   TOURNAMENT: 'type'      - Displays Tournament information (MINING, KILLS, or CURRENCY_GAINED subtypes like 'tokens')
#
# Available KoTH Placeholders (update every second):
#   %status%                - Current status (Active/Inactive/Disabled/Not Found)
#   %capture_time%          - Total time required to capture
#   %current_capture_time%  - Current capture progress
#   %remaining_capture_time% - Time remaining to capture
#   %controlling_gang_display% - Display name of gang currently capping
#   %controlling_gang%      - Name of gang currently capping
#   %x%                     - Center X coordinate
#   %z%                     - Center Z coordinate
#   %world%                 - World name
#   %time_until_start%      - Time until next scheduled start
#
# Available Tournament Placeholders (update every second):
#   %status%                - Current status (Active/Inactive/Disabled/Invalid Type)
#   %leading_gang_display%  - Display name of leading gang
#   %leading_gang%          - Name of leading gang
#   %leading_gang_score%    - Score of leading gang
#   %time_until_start%      - Time until next scheduled start
#   %time_remaining%        - Time remaining in active tournament
#
# Click Commands:
#   [player] command        - Run command as player
#   [console] command       - Run command as console
#   [close]                 - Close the inventory

ROWS: 4
TITLE: "&8Gang Schedules"

ITEMS:
  KOTH_EXAMPLE:
    KOTH: 'example'
    SLOT: 10
    USE-TEXTURE: true
