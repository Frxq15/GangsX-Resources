          glow: true
          lore:
            - '&7&o"%description%"'
            - ''
            - '&eInformation:'
            - '&e&l | &fType: &eDaily'
            - '&e&l | &fProgress: &a%target%&f/&a%target%'
            - ''
            - '&eRewards:'
