      message_gang: true
      message:
        - ''
        - '&a&lCongratulations!'
        - '&fYour gang finished &e&l#1 &fin the &d%type% &ftournament.'
        - ''
        - '&fYour gang has been given:'
        - '&b&l | &e15x Gang Coins'
        - '&b&l | &d10x Gang Points'
